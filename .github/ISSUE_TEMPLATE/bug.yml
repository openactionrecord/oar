name: Bug report
description: Something does not work, or verification gives the wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands, code, or a minimal bundle. Never paste real keys or undisclosed values.
  - type: input
    id: version
    attributes:
      label: Package and version
      placeholder: "@openactionrecord/core 0.1.0, Node 22"
